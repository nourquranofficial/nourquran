name: Build Android APK
 
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'icon-512.png'
      - '.github/workflows/build-apk.yml'
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 22
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
 
      - name: Install JS deps
        run: npm install --no-audit --no-fund
 
      - name: Create Android project
        run: npx cap add android
 
      - name: Prepare (icons, manifest, google-services.json)
        run: |
          pip install pillow
          python3 scripts/prepare.py
 
      - name: Sync Capacitor
        run: npx cap sync android
 
      - name: Build release APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
 
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "built: $UNSIGNED"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nour.p12"
            KS_ALIAS="nour-key"
          else
            echo "::warning::مفيش ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD في Secrets — هنوقّع بمفتاح مؤقت. الـ APK هيشتغل بس مش هينفع تحدّث فوق نسخة سابقة (لازم تمسح القديمة)."
            KS_PASS="temp-$(date +%s)"
            KS_ALIAS="nour"
            keytool -genkeypair -keystore "$RUNNER_TEMP/nour.p12" -storetype PKCS12 -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Nour Temp"
          fi
          export KS_PASS
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/nour.p12" --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out nour.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs nour.apk | head -3
          ls -la nour.apk
 
      - uses: actions/upload-artifact@v4
        with:
          name: nour-apk
          path: android-app/nour.apk
 
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest nour.apk \
            --title "نور — تطبيق أندرويد" \
            --notes "آخر نسخة من تطبيق نور للأندرويد. نزّل nour.apk وثبّته (اسمح بالتثبيت من مصادر غير معروفة لو طلب). التطبيق بيفتح الموقع الحي فبيتحدّث لوحده مع كل رفع."
 
