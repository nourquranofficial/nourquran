            KS_PASS="temp-$(date +%s)"
            KS_ALIAS="nour"
            keytool -genkeypair -keystore "$RUNNER_TEMP/nour.p12" -storetype PKCS12 -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Nour Temp"
          fi
          export KS_PASS
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/nour.p12" --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out nour.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs nour.apk | head -3
          ls -la nour.apk
باسورد المفتاح عندك نفس باسورد الـ keystore، فـ --key-pass env:KS_PASS صح ومش محتاج Secret تاني.

بعد ما تحفظ الملف: Actions ← Build Android APK ← Run workflow.

علشان تتأكد إنه وقّع بمفتاح الستور مش المؤقت، افتح لوج خطوة Sign APK. لازم تلاقي سطر Signer #1 certificate SHA-256 وقيمته تبدأ بـ:

4ddf5efddb2772d8f73a3422aff966ad0a1328da5a827faf d73effe0cf89f044
(نفس بصمة signing.keystore، من غير الفاصلتين والمسافة). لو ظهرت الرسالة مفيش ANDROID_KEYSTORE_B64...، يبقى السيكرتس مش مقروءة، ابعتلي اللوج.

